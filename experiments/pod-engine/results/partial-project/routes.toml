# Pipeline 路由配置
# 每条路由映射一个命令/端点到对应的 pipeline 文件
# 由 compose 命令自动注册，也可手动编辑

[step_breakout_simulation]
pipeline = "pipelines/step_breakout_simulation.py"
description = "推进一次固定时间步的 Breakout 物理模拟。从 params 或 Context 读取 commands（字典，键为 left/right/fire/pause/reset，值为 boolean）。调用 BreakoutSimulationService.execute(commands)，将返回的 entities、game_state、score、lives、ball_attached 写入 Context，并作为本 Pipeline 摘要返回。此 Pipeline 不循环，适合交互式逐帧或测试步进。"
